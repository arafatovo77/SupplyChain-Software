{% extends 'base.html' %}
{% block title %}Report Access - SCM{% endblock %}
{% block page_title %}<i class="fas fa-lock me-2"></i>Security Verification{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow border-0">
      <div class="card-header bg-primary text-white py-3 text-center">
        <i class="fas fa-shield-alt fa-2x mb-2 text-warning"></i>
        <h5 class="mb-0 fw-bold">Report Password Verification</h5>
      </div>
      <div class="card-body p-4 text-center">
        <p class="text-muted mb-3">
          This report (<code>{{ filename }}</code>) is restricted. Enter security password to download.
        </p>

        <form method="POST" action="{{ url_for('download_report', filename=filename) }}">
          <div class="mb-3 text-start">
            <label class="form-label fw-bold small text-muted">Password / PIN</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-key"></i></span>
              <input type="password" name="password" class="form-control text-center fs-5" placeholder="Enter PIN (e.g. 2201)" autofocus required>
            </div>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary py-2 fw-bold">
              <i class="fas fa-unlock-alt me-1"></i> Unlock & Download
            </button>
            <a href="{{ url_for('reports') }}" class="btn btn-outline-secondary">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
